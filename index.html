<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <title>Mario Game</title>
</head>
<body>
    <div class="game-board day" id="gameBoard">
        <img src="./img/mario.gif" class="mario" alt="Mario" />
        <img src="./img/pipe.png" class="pipe" alt="Cano" />
        <img src="./img/clouds.png" class="clouds" alt="Nuvens" />
        <img src="./img/luigi_running_by_win1945_dfk55sp.gif" alt="">

        <div class="score-board">
            <h2>Fase: <span id="fase">1</span></h2>
            <h2>Pontos: <span id="pontos">0</span></h2>
        </div>

        <button id="restartButton">Reiniciar Jogo</button>

        <div id="finalScene">
            <p>Parabéns! Você completou o jogo. Clique no vídeo para assistir o final.</p>
            <video id="finalVideo" src="./video/ssstik.io_@fantocheromantizado_1776141314644.mp4" controls></video>
        </div>
    </div>
</body>
</html>
