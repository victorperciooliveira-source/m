<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <title>Mario Game</title>
</head>
<body>
    <div class="game-board day" id="gameBoard">
        <img src="./img/mario.gif" class="mario" />
        <img src="./img/pipe.png" class="pipe" />
        <img src="./img/clouds.png" class="clouds" />
        <img src="./img/placidplace-drops-13474_256.gif" alt="">
        <img src="./img/super-mario-world-yoshi.gif" alt="">
    

        <div class="score-board">
            <h2>Fase: <span id="fase">1</span></h2>
            <h2>Pontos: <span id="pontos">0</span></h2>
        </div>

        <button id="restartButton">Reiniciar Jogo</button>

        <div id="finalScene" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; flex-direction: column; z-index: 100;">
            <p style="color: white; font-size: 24px; margin-bottom: 20px;">Parabéns! Você completou o jogo. Clique no vídeo para assistir o final.</p>
            <video id="finalVideo" src="./video/ssstik.io_@fantocheromantizado_1776141314644.mp4" controls style="width: 80%; max-width: 600px;"></video>
        </div>
    </div>
</body>
</html>
